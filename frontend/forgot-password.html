<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Reset Password | CluckCart</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

<header class="header">
  <div class="logo">🐔 CluckCart</div>
  <nav class="nav" id="navLinks"></nav>
</header>

<section class="login-section">
  <div class="login-container">
    <h2>Reset Password</h2>
    <p>Enter your registered mobile number</p>

    <form class="login-form forgot-form">

      <!-- MOBILE NUMBER -->
      <label for="mobile">Mobile Number</label>
      <div style="display:flex; gap:10px;">
        <input type="tel" id="mobile" maxlength="10" required style="flex:1;">
        <button type="button" id="sendOtpReset">Send OTP</button>
      </div>

      <!-- OTP -->
      <label for="resetOtp">Enter OTP</label>
      <input type="text" id="resetOtp" maxlength="6" required placeholder="Enter OTP">

      <!-- NEW PASSWORD -->
      <label for="newPass">New Password</label>
      <div class="password-row">
        <input type="password" id="newPass" required>
        <button type="button" class="password-toggle" data-target="newPass">👁</button>
      </div>

      <!-- CONFIRM PASSWORD -->
      <label for="confirmPass">Confirm Password</label>
      <div class="password-row">
        <input type="password" id="confirmPass" required>
        <button type="button" class="password-toggle" data-target="confirmPass">👁</button>
      </div>

      <button type="submit">Reset Password</button>

      <p style="margin-top:12px;">
        Remembered? <a href="login.html">Back to Login</a>
      </p>
    </form>
  </div>
</section>

<footer class="footer">
  <p>© 2025 CluckCart. All rights reserved.</p>
</footer>

<script>
/* ------------- NAVBAR ------------- */
document.addEventListener('DOMContentLoaded', function () {
  const nav = document.getElementById('navLinks');
  const user = JSON.parse(localStorage.getItem('currentUser') || 'null');

  let links = `
    <a href="index.html">Home</a>
    <a href="post-ad.html">Post Ad</a>
    <a href="listing.html">Browse Listings</a>
  `;

  if (!user) {
    links += `
      <a href="login.html">Login</a>
      <a href="register.html">Register</a>
    `;
  } else {
    if (user.role === 'admin') {
      links += `<a href="admin.html">Admin</a>`;
    }
    links += `
      <div class="nav-profile">
        <button type="button" class="nav-profile-btn">
          <span>👤 ${user.name}</span><span>▾</span>
        </button>
        <div class="nav-profile-menu">
          <a href="my-ads.html">My Ads</a>
          <a href="#" id="logoutLink">Logout</a>
        </div>
      </div>
    `;
  }

  nav.innerHTML = links;

  const logout = document.getElementById('logoutLink');
  if (logout) {
    logout.addEventListener('click', function (e) {
      e.preventDefault();
      localStorage.removeItem('currentUser');
      window.location.href = 'index.html';
    });
  }

  // profile dropdown
  const profile = nav.querySelector('.nav-profile');
  if (profile) {
    const btn = profile.querySelector('.nav-profile-btn');
    btn.addEventListener('click', (e) => {
      e.stopPropagation();
      profile.classList.toggle('open');
    });
    document.addEventListener('click', (e) => {
      if (!profile.contains(e.target)) {
        profile.classList.remove('open');
      }
    });
  }
});

/* ------------- HELPERS ------------- */
function isValidMobile(mobile) {
  return /^[1-9][0-9]{9}$/.test(mobile); // 10 digits, not starting with 0
}

/* ------------- SEND OTP ------------- */
document.getElementById('sendOtpReset').addEventListener('click', () => {
  const mobile = document.getElementById('mobile').value.trim();

  if (!isValidMobile(mobile)) {
    alert('Please enter a valid 10-digit mobile number.');
    return;
  }

  const otp = Math.floor(1000 + Math.random() * 9000);
  localStorage.setItem('resetOtp', String(otp));
  localStorage.setItem('resetOtpMobile', mobile);

  // demo only (no SMS)
  alert('Your OTP is: ' + otp);
});

/* ------------- RESET PASSWORD SUBMIT ------------- */
document.querySelector('.forgot-form').addEventListener('submit', function (e) {
  e.preventDefault();

  const mobile = document.getElementById('mobile').value.trim();
  const otpInput = document.getElementById('resetOtp').value.trim();
  const newPass = document.getElementById('newPass').value.trim();
  const confirm = document.getElementById('confirmPass').value.trim();

  if (!isValidMobile(mobile)) {
    alert('Invalid mobile number.');
    return;
  }

  if (newPass !== confirm) {
    alert('Passwords do not match.');
    return;
  }

  const storedOtp = localStorage.getItem('resetOtp');
  const storedMobile = localStorage.getItem('resetOtpMobile');

  if (otpInput !== storedOtp || storedMobile !== mobile) {
    alert('Invalid OTP.');
    return;
  }

  // Admin reset (silent)
  if (mobile === '9999999999') {
    localStorage.setItem('adminPassword', newPass);
    alert('Admin password reset successful!');
    window.location.href = 'login.html';
    return;
  }

  // User reset
  let users = JSON.parse(localStorage.getItem('users') || '[]');
  const idx = users.findIndex(u => u.mobile === mobile);

  if (idx === -1) {
    alert('Mobile number not registered.');
    return;
  }

  users[idx].password = newPass;
  localStorage.setItem('users', JSON.stringify(users));

  alert('Password reset successful!');
  window.location.href = 'login.html';
});

/* ------------- EYE TOGGLE ------------- */
document.querySelectorAll('.password-toggle').forEach(btn => {
  btn.addEventListener('click', () => {
    const input = document.getElementById(btn.dataset.target);
    const isHidden = input.type === 'password';
    input.type = isHidden ? 'text' : 'password';
    btn.textContent = isHidden ? '🙈' : '👁';
  });
});
</script>

</body>
</html>
