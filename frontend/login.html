<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Login | CluckCart</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>

<header class="header">
  <div class="logo">🐔 CluckCart</div>
  <nav class="nav">
    <a href="index.html">Home</a>
    <a href="post-ad.html">Post Ad</a>
    <a href="listing.html">Browse Listings</a>
    <a href="login.html">Login</a>
    <a href="register.html">Register</a>
  </nav>
</header>

<section class="login-section">
  <div class="login-container">
    <h2>Login</h2>

    <form id="loginForm" class="login-form">

      <label for="mobile">Mobile Number</label>
      <input type="tel" id="mobile" maxlength="10"
             placeholder="Enter your number" required>

      <label for="password">Password</label>
      <div class="password-row">
        <input type="password" id="password"
               placeholder="Enter password" required>
        <button type="button" class="password-toggle" data-target="password">👁</button>
      </div>

      <button type="submit">Login</button>

      <p style="margin-top:10px;">
        <a href="forgot-password.html">Forgot Password?</a>
      </p>

      <p style="margin-top:10px;">
        New user? <a href="register.html">Register</a>
      </p>

      <p id="errorMsg" style="color:red; display:none;">
        Invalid mobile or password
      </p>

    </form>
  </div>
</section>

<footer class="footer">
  <p>© 2025 CluckCart. All rights reserved.</p>
</footer>

<script>
/* ================= HELPERS ================= */
function isValidMobile(mobile) {
  return /^[1-9][0-9]{9}$/.test(mobile);
}

/* ================= PASSWORD TOGGLE ================= */
document.querySelectorAll(".password-toggle").forEach(btn => {
  btn.addEventListener("click", () => {
    const input = document.getElementById(btn.dataset.target);
    const hidden = input.type === "password";
    input.type = hidden ? "text" : "password";
    btn.textContent = hidden ? "🙈" : "👁";
  });
});

/* ================= LOGIN SUBMIT ================= */
const loginForm = document.getElementById("loginForm");
const errorMsg = document.getElementById("errorMsg");

loginForm.addEventListener("submit", function (e) {
  e.preventDefault();
  errorMsg.style.display = "none";

  const mobile = document.getElementById("mobile").value.trim();
  const password = document.getElementById("password").value.trim();

  if (!isValidMobile(mobile)) {
    alert("Enter valid 10-digit mobile number.");
    return;
  }

  fetch("http://localhost:3000/api/auth/login", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ mobile, password })
  })
  .then(res => {
    if (!res.ok) throw new Error();
    return res.json();
  })
  .then(user => {
    // store session
    localStorage.setItem("currentUser", JSON.stringify(user));

    // redirect by role
    if (user.role === "admin") {
      window.location.href = "admin.html";
    } else {
      window.location.href = "index.html";
    }
  })
  .catch(() => {
    errorMsg.style.display = "block";
  });
});
</script>

</body>
</html>
