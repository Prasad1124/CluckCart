<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Register | CluckCart</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="style.css">
</head>
<body>

<header class="header">
  <div class="logo">🐔 CluckCart</div>
  <nav class="nav">
    <a href="index.html">Home</a>
    <a href="post-ad.html">Post Ad</a>
    <a href="listing.html">Browse Listings</a>
    <a href="login.html">Login</a>
    <a href="register.html">Register</a>
  </nav>
</header>

<section class="register-section">
  <div class="register-container">
    <h2>Create Account</h2>
    <p>Register using your mobile number</p>

    <!-- ✅ FIXED FORM -->
    <form id="registerForm" class="register-form">

      <!-- NAME -->
      <label for="name">Full Name</label>
      <input type="text" id="name" placeholder="Enter your full name" required />

      <!-- MOBILE -->
      <label for="mobile">Mobile Number</label>
      <div style="display:flex; gap:10px;">
        <input type="tel" id="mobile" maxlength="10"
               placeholder="10-digit mobile number" required style="flex:1;">
        <button type="button" id="sendOtpBtn">Send OTP</button>
      </div>

      <!-- OTP -->
      <label for="otp">Enter OTP</label>
      <input type="text" id="otp" maxlength="6"
             placeholder="Enter OTP received on mobile" required />

      <!-- PASSWORD -->
      <label for="password">Password</label>
      <div class="password-row">
        <input type="password" id="password" placeholder="Create password" required />
        <button type="button" class="password-toggle" data-target="password">👁</button>
      </div>

      <!-- CONFIRM PASSWORD -->
      <label for="confirmPassword">Confirm Password</label>
      <div class="password-row">
        <input type="password" id="confirmPassword" placeholder="Confirm password" required />
        <button type="button" class="password-toggle" data-target="confirmPassword">👁</button>
      </div>

      <button type="submit">Register</button>

      <p style="margin-top:12px;">
        Already have an account? <a href="login.html">Login here</a>
      </p>

    </form>
  </div>
</section>

<footer class="footer">
  <p>© 2025 CluckCart. All rights reserved.</p>
</footer>

<script>
/* ================= HELPERS ================= */
function isValidMobile(mobile) {
  return /^[1-9][0-9]{9}$/.test(mobile);
}

/* ================= PASSWORD TOGGLE ================= */
document.querySelectorAll(".password-toggle").forEach(btn => {
  btn.addEventListener("click", () => {
    const input = document.getElementById(btn.dataset.target);
    const hidden = input.type === "password";
    input.type = hidden ? "text" : "password";
    btn.textContent = hidden ? "🙈" : "👁";
  });
});

/* ================= SEND OTP ================= */
const sendOtpBtn = document.getElementById("sendOtpBtn");
const mobileInput = document.getElementById("mobile");

sendOtpBtn.addEventListener("click", () => {
  const mobile = mobileInput.value.trim();

  if (!isValidMobile(mobile)) {
    alert("Please enter a valid 10-digit mobile number.");
    return;
  }

  fetch("http://localhost:3000/api/otp/send", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ mobile })
  })
  .then(res => res.json())
  .then(data => {
    if (data.success) {
      alert("OTP sent successfully to your mobile.");
    } else {
      alert("Failed to send OTP.");
    }
  })
  .catch(err => {
  console.error(err);
  alert("Failed to send OTP. Check backend logs.");
});
});


/* ================= REGISTER SUBMIT ================= */
const registerForm = document.getElementById("registerForm");

registerForm.addEventListener("submit", function (e) {
  e.preventDefault();

  const name = document.getElementById("name").value.trim();
  const mobile = mobileInput.value.trim();
  const otp = document.getElementById("otp").value.trim();
  const password = document.getElementById("password").value.trim();
  const confirmPassword = document.getElementById("confirmPassword").value.trim();

  if (!isValidMobile(mobile)) {
    alert("Invalid mobile number.");
    return;
  }

  if (password !== confirmPassword) {
    alert("Passwords do not match.");
    return;
  }

  // 1️⃣ VERIFY OTP
  fetch("http://localhost:3000/api/otp/verify", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ mobile, otp })
  })
  .then(res => res.json())
  .then(data => {
    if (!data.success) {
      alert("Invalid or expired OTP.");
      return;
    }

    // 2️⃣ REGISTER USER
    return fetch("http://localhost:3000/api/auth/register", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ name, mobile, password })
    });
  })
  .then(res => {
    if (!res) return;
    if (!res.ok) throw new Error();
    alert("Registration successful! Please login.");
    window.location.href = "login.html";
  })
  .catch(() => {
    alert("Registration failed. User may already exist.");
  });
});
</script>

</body>
</html>
