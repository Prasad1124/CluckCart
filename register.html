
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register | CluckCart</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<header class="header">
  <div class="logo">🐔 CluckCart</div>
  <nav class="nav">
    <a href="index.html">Home</a>
    <a href="post-ad.html">Post Ad</a>
    <a href="listing.html">Browse Listings</a>
    <a href="login.html">Login</a>
    <a href="register.html">Register</a>
  </nav>
</header>

<section class="register-section">
  <div class="register-container">
    <h2>Create Account</h2>
    <p>Register using your mobile number</p>

    <form id="registerForm" class="register-form">

      <label for="name">Full Name</label>
      <input type="text" id="name"
             placeholder="Enter your full name" required>

      <label for="mobile">Mobile Number</label>
      <div style="display:flex; gap:10px;">
        <input type="tel" id="mobile" maxlength="10"
               placeholder="10-digit mobile number"
               required style="flex:1;">
        <button type="button" id="sendOtpBtn">Send OTP</button>
      </div>

      <label for="otp">Enter Demo OTP</label>
      <input type="text" id="otp" maxlength="4"
             inputmode="numeric"
             placeholder="Enter demo OTP 1234" required>

      <label for="password">Password</label>
      <div class="password-row">
        <input type="password" id="password"
               placeholder="Create password" required>
        <button type="button" class="password-toggle"
                data-target="password">👁</button>
      </div>

      <label for="confirmPassword">Confirm Password</label>
      <div class="password-row">
        <input type="password" id="confirmPassword"
               placeholder="Confirm password" required>
        <button type="button" class="password-toggle"
                data-target="confirmPassword">👁</button>
      </div>

      <button type="submit" id="registerBtn">Register</button>

      <p style="margin-top:12px;">
        Already have an account?
        <a href="login.html">Login here</a>
      </p>
    </form>
  </div>
</section>

<footer class="footer">
  <p>© 2025 CluckCart. All rights reserved.</p>
</footer>

<script>
const API_URL = "https://cluckcart-backend.onrender.com/api";

const form = document.getElementById("registerForm");
const mobileInput = document.getElementById("mobile");
const otpInput = document.getElementById("otp");
const sendOtpBtn = document.getElementById("sendOtpBtn");
const registerBtn = document.getElementById("registerBtn");

let otpSentForMobile = "";

function isValidMobile(mobile) {
  return /^[6-9]\d{9}$/.test(mobile);
}

async function readResponse(response) {
  const data = await response.json().catch(() => ({}));

  if (!response.ok) {
    throw new Error(data.message || `Server error: ${response.status}`);
  }

  return data;
}

// Password visibility
document.querySelectorAll(".password-toggle").forEach(button => {
  button.addEventListener("click", () => {
    const input = document.getElementById(button.dataset.target);
    input.type = input.type === "password" ? "text" : "password";
    button.textContent = input.type === "password" ? "👁" : "🙈";
  });
});

// If mobile number changes, require sending OTP again
mobileInput.addEventListener("input", () => {
  if (mobileInput.value.trim() !== otpSentForMobile) {
    otpSentForMobile = "";
  }
});

// Send demo OTP
sendOtpBtn.addEventListener("click", async () => {
  const mobile = mobileInput.value.trim();

  if (!isValidMobile(mobile)) {
    alert("Enter a valid 10-digit Indian mobile number.");
    return;
  }

  sendOtpBtn.disabled = true;

  try {
    const response = await fetch(`${API_URL}/otp/send`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ mobile })
    });

    const data = await readResponse(response);

    if (!data.success) {
      throw new Error(data.message || "Could not generate demo OTP.");
    }

    otpSentForMobile = mobile;
    otpInput.value = "";
    alert("Demo OTP: 1234. No SMS was sent.");

  } catch (error) {
    console.error("Send OTP error:", error);
    alert(error.message || "Unable to connect to backend.");
  } finally {
    sendOtpBtn.disabled = false;
  }
});

// Register
form.addEventListener("submit", async event => {
  event.preventDefault();

  const name = document.getElementById("name").value.trim();
  const mobile = mobileInput.value.trim();
  const otp = otpInput.value.trim();
  const password = document.getElementById("password").value;
  const confirmPassword =
    document.getElementById("confirmPassword").value;

  if (!name) {
    alert("Please enter your name.");
    return;
  }

  if (!isValidMobile(mobile)) {
    alert("Enter a valid 10-digit mobile number.");
    return;
  }

  if (otpSentForMobile !== mobile) {
    alert("Please click Send OTP for this mobile number first.");
    return;
  }

  if (password.length < 6) {
    alert("Password must contain at least 6 characters.");
    return;
  }

  if (password !== confirmPassword) {
    alert("Passwords do not match.");
    return;
  }

  if (otp !== "1234") {
    alert("Invalid demo OTP. Please enter 1234.");
    return;
  }

  registerBtn.disabled = true;
  registerBtn.textContent = "Registering...";

  try {
    // Verify OTP using the same deployed backend
    const verifyResponse = await fetch(`${API_URL}/otp/verify`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ mobile, otp })
    });

    const verifyData = await readResponse(verifyResponse);

    if (!verifyData.success) {
      throw new Error(verifyData.message || "OTP verification failed.");
    }

    // Register user
    const registerResponse = await fetch(`${API_URL}/auth/register`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ name, mobile, password })
    });

    const registerData = await readResponse(registerResponse);

    if (!registerData.success) {
      throw new Error(registerData.message || "Registration failed.");
    }

    alert("Registration successful! Please login.");
    window.location.href = "login.html";

  } catch (error) {
    console.error("Registration error:", error);
    alert(error.message || "Registration failed. Please try again.");
  } finally {
    registerBtn.disabled = false;
    registerBtn.textContent = "Register";
  }
});
</script>

</body>
</html>
